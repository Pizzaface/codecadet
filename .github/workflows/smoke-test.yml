name: Smoke Tests (Fast)

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  smoke-test:
    name: Quick Smoke Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: uv pip install pyside6>=6.9.1

    - name: Test platform_utils import
      run: uv run python -c "from platform_utils import Platform, Shell, TerminalLauncher; print('✓ Imports OK')"

    - name: Test platform detection
      run: uv run python -c "from platform_utils import Platform; print(f'Platform: Windows={Platform.is_windows()}, macOS={Platform.is_macos()}, Linux={Platform.is_linux()}')"

    - name: Test shell detection
      run: uv run python -c "from platform_utils import Shell; shell = Shell.get_user_shell(); print(f'✓ Detected shell: {shell}')"

    - name: Verify shell args
      run: uv run python -c "from platform_utils import Shell; args = Shell.get_shell_args(Shell.get_user_shell(), 'echo test'); print(f'✓ Shell args: {args}')"
